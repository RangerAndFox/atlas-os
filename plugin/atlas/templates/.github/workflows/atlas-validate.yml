name: atlas-validate
# The evidence job. Every rung is required: a skipped rung is NEVER a pass.
# This is the required status check referenced by the branch ruleset.
on:
  pull_request:
  push:
    branches: ["{{DEFAULT_BRANCH}}"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas-validate:
    name: atlas-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: {{DEV_IMAGE_DIGEST}}
      options: --user root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain matches the project pin
        run: |
          set -euo pipefail
          want="$(node -e 'const p=require("./package.json");process.stdout.write(String((p.engines&&p.engines.node)||""))')"
          have="$(node --version)"
          echo "declared=$want actual=$have"
          [ -n "$want" ] || { echo "::error::No Node pin declared in package.json engines"; exit 1; }
          node -e 'const s=require("semver");' 2>/dev/null || npm i -g semver@7 --silent
          node -e '
            const semver=require("semver");
            const want=process.argv[1], have=process.argv[2].replace(/^v/,"");
            if(!semver.satisfies(have,want)){console.error(`::error::Node ${have} does not satisfy ${want}`);process.exit(1);}
            console.log("node pin satisfied");
          ' "$want" "$have"

      - name: Dependencies are already baked (cache hit expected)
        run: |
          set -euo pipefail
          if [ ! -d node_modules ]; then
            echo "::warning::node_modules absent in the certified image; restoring. Rebuild the dev image."
            npm ci --ignore-scripts
          fi
          test -x node_modules/.bin/playwright || { echo "::error::playwright binary missing"; exit 1; }

      - name: Manifests unmutated by the build
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # This step used to run immediately after actions/checkout, where a fresh
          # checkout has no unstaged changes by construction — so `git diff` was
          # always clean and the rung reported green regardless of the PR. It now
          # runs AFTER dependency restore, where it asserts something real: that
          # `npm ci` did not rewrite the lockfile (engine mismatch, lockfileVersion
          # drift, a postinstall touching a manifest). Whether the PR *itself*
          # changes a manifest is a human decision and CODEOWNERS already enforces it.
          if ! git diff --quiet -- package.json package-lock.json; then
            echo "::error::The build mutated package.json or package-lock.json. The image and the lockfile disagree."
            git diff --stat -- package.json package-lock.json
            exit 1
          fi

{{LADDER_STEPS}}

      - name: Evidence record
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .atlas/evidence
          cat > .atlas/evidence/validation-${{ github.run_id }}.json <<JSON
          { "runner": "atlas_ci",
            "repository": "${{ github.repository }}",
            "gitHead": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "image": "{{DEV_IMAGE_DIGEST}}",
            "runId": "${{ github.run_id }}",
            "conclusion": "${{ job.status }}",
            "finishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)" }
          JSON
          cat .atlas/evidence/validation-${{ github.run_id }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: atlas-evidence-${{ github.run_id }}
          path: .atlas/evidence/
          retention-days: 30
