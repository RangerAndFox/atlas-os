# Atlas design review — render the UI in CI, screenshot it, and have the design-director
# review the actual pixels plus the repo's own end-to-end run. The verdict becomes a merge
# decision through plugin/atlas/design/gate.mjs (evaluateDesignGate), which is unit-tested
# in tests/acceptance/design-director/ — so the logic proven by tests is the logic enforced
# here. Fail-closed: missing evidence, a dead harness, a failing e2e, or an absent verdict
# all BLOCK. Config is read from .atlas/project.json's `design` block (human-written).
#
# Make this a REQUIRED status check on the default branch to give the review teeth.
name: atlas-design-review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: atlas-design-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  design_evidence:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.cfg.outputs.enabled }}
      user_facing: ${{ steps.scope.outputs.userFacing }}
      harness_exit: ${{ steps.harness.outputs.exit || steps.cap.outputs.exit }}
      ready_ok: ${{ steps.harness.outputs.readyOk || steps.cap.outputs.readyOk }}
      captured: ${{ steps.shots.outputs.captured || steps.cap.outputs.captured }}
      declared: ${{ steps.shots.outputs.declared || steps.cap.outputs.declared }}
      function_exit: ${{ steps.fn.outputs.exit }}
      override_present: ${{ steps.override.outputs.present }}
      override_owner: ${{ steps.override.outputs.owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # ---- Owner override (mirrors atlas-review) ---------------------------
      # A NO-GO blocks. Only the owner, verified by the labeling actor, may override
      # via `atlas-override-design`. The machine account cannot self-clear. Override
      # bypasses THIS check only; code-owner review on guarded paths still stands.
      - name: Honor owner override
        id: override
        run: |
          set -euo pipefail
          present=false; owner=false
          if [ "${{ github.event.action }}" = "labeled" ] \
             && [ "${{ github.event.label.name }}" = "atlas-override-design" ]; then
            present=true
            if [ "${{ github.event.sender.login }}" = "${{ vars.ATLAS_OWNER }}" ]; then owner=true; fi
          fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
          echo "owner=$owner"     >> "$GITHUB_OUTPUT"

      # ---- Read design config + decide scope -------------------------------
      - name: Read design config
        id: cfg
        run: |
          set -euo pipefail
          node --input-type=module <<'EOF' >> "$GITHUB_OUTPUT"
          import fs from "node:fs";
          const p = ".atlas/project.json";
          const cfg = fs.existsSync(p) ? (JSON.parse(fs.readFileSync(p, "utf8")).design ?? {}) : {};
          const enabled = cfg.enabled === true;
          const node = (() => { try { return JSON.parse(fs.readFileSync(p,"utf8")).runtime?.node ?? "20"; } catch { return "20"; } })();
          console.log(`enabled=${enabled}`);
          console.log(`browsers=${cfg.browsers ?? "chromium"}`);
          console.log(`harness=${cfg.harness ?? ""}`);
          console.log(`readyUrl=${cfg.readyUrl ?? ""}`);
          console.log(`functionSignal=${cfg.functionSignal ?? ""}`);
          console.log(`node=${String(node).replace(/[^0-9.x]/g,"") || "20"}`);
          // Capture mode: if the repo supplies a captureCommand it drives capture through
          // its OWN Playwright harness (server boot, auth, DB, browser resolution already
          // solved there) — the honest choice for apps behind auth or needing a database.
          // Otherwise fall back to the built-in generic build+serve+goto capture.
          const captureCommand = cfg.captureCommand ?? "";
          console.log(`captureCommand=${captureCommand}`);
          console.log(`captureMode=${captureCommand ? "command" : "inline"}`);
          console.log(`declared=${(cfg.screens ?? []).length * (cfg.viewports ?? ["desktop","mobile"]).length}`);
          // Emit screens/viewports/paths as compact JSON for later steps.
          const b64 = (o) => Buffer.from(JSON.stringify(o)).toString("base64");
          console.log(`screens_b64=${b64(cfg.screens ?? [])}`);
          console.log(`viewports_b64=${b64(cfg.viewports ?? ["desktop","mobile"])}`);
          console.log(`paths_b64=${b64(cfg.paths ?? [])}`);
          EOF

      - name: Determine if PR is user-facing
        id: scope
        run: |
          set -euo pipefail
          git fetch origin ${{ github.event.pull_request.base.sha }} --depth=1 || true
          CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} || true)
          printf '%s\n' "$CHANGED" > /tmp/changed.txt
          node --input-type=module <<'EOF' >> "$GITHUB_OUTPUT"
          import fs from "node:fs";
          const paths = JSON.parse(Buffer.from(process.env.PATHS_B64 || "W10=", "base64").toString("utf8"));
          const changed = fs.readFileSync("/tmp/changed.txt","utf8").split("\n").filter(Boolean);
          const mm = (glob, f) => {
            const re = new RegExp("^" + glob
              .replace(/[.+^${}()|[\]\\]/g, "\\$&")
              .replace(/\*\*/g, "§§").replace(/\*/g, "[^/]*").replace(/§§/g, ".*") + "$");
            return re.test(f);
          };
          const touches = paths.length > 0 && changed.some((f) => paths.some((g) => mm(g, f)));
          console.log(`userFacing=${touches}`);
          EOF
        env:
          PATHS_B64: ${{ steps.cfg.outputs.paths_b64 }}

      # ---- Everything below only matters when enabled AND user-facing ------
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.cfg.outputs.enabled == 'true' && steps.scope.outputs.userFacing == 'true'
        with:
          node-version: ${{ steps.cfg.outputs.node }}

      - name: Install deps
        id: install
        if: steps.cfg.outputs.enabled == 'true' && steps.scope.outputs.userFacing == 'true'
        run: npm ci || npm install

      - name: Install Playwright browser
        if: steps.cfg.outputs.enabled == 'true' && steps.scope.outputs.userFacing == 'true'
        run: npx playwright install --with-deps ${{ steps.cfg.outputs.browsers }}

      # ---- Capture, mode A: the repo's own harness (auth/DB apps) ----------
      # The repo command boots its own server (via its playwright.config webServer or
      # equivalent), authenticates, and writes one PNG per declared screen×viewport to
      # artifacts/design/. Its exit code is the honest harness signal; the PNG count is
      # the evidence. Both feed the same gate as the inline path.
      - name: Capture via repo command
        id: cap
        if: steps.cfg.outputs.enabled == 'true' && steps.scope.outputs.userFacing == 'true' && steps.cfg.outputs.captureMode == 'command'
        run: |
          set +e
          mkdir -p artifacts/design
          bash -lc "${{ steps.cfg.outputs.captureCommand }}"
          code=$?
          n=$(find artifacts/design -type f -name '*.png' | wc -l | tr -d ' ')
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then echo "readyOk=true" >> "$GITHUB_OUTPUT"; else echo "readyOk=false" >> "$GITHUB_OUTPUT"; fi
          echo "captured=$n" >> "$GITHUB_OUTPUT"
          echo "declared=${{ steps.cfg.outputs.declared }}" >> "$GITHUB_OUTPUT"

      # ---- Capture, mode B: built-in generic capture (simple static UIs) ---
      - name: Bring the UI up
        id: harness
        if: steps.cfg.outputs.enabled == 'true' && steps.scope.outputs.userFacing == 'true' && steps.cfg.outputs.captureMode == 'inline'
        run: |
          set +e
          nohup bash -lc "${{ steps.cfg.outputs.harness }}" > /tmp/harness.log 2>&1 &
          echo $! > /tmp/harness.pid
          ok=false
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.cfg.outputs.readyUrl }}" || echo 000)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 2
          done
          # The harness is a long-running server started in the background, so $? from the
          # poll loop above is meaningless (it is the last `sleep`). The honest failure
          # signal is whether the server process is still alive: if the pid is gone, the
          # harness crashed on startup -> report non-zero so the gate's harnessExitCode
          # branch fires. `readyOk` is the separate "came up and answered" signal. Both
          # are fail-closed; neither is a dead input.
          if kill -0 "$(cat /tmp/harness.pid 2>/dev/null)" 2>/dev/null; then hexit=0; else hexit=1; fi
          echo "exit=$hexit" >> "$GITHUB_OUTPUT"
          echo "readyOk=$ok" >> "$GITHUB_OUTPUT"

      - name: Capture screenshots
        id: shots
        if: steps.cfg.outputs.enabled == 'true' && steps.scope.outputs.userFacing == 'true' && steps.cfg.outputs.captureMode == 'inline'
        run: |
          set -euo pipefail
          mkdir -p artifacts/design
          node --input-type=module <<'EOF' >> "$GITHUB_OUTPUT"
          import { chromium } from "playwright";
          const screens = JSON.parse(Buffer.from(process.env.SCREENS_B64,"base64").toString("utf8"));
          const viewports = JSON.parse(Buffer.from(process.env.VIEWPORTS_B64,"base64").toString("utf8"));
          const sizes = { desktop: { width: 1440, height: 900 }, mobile: { width: 390, height: 844 } };
          const base = process.env.READY_URL;
          const declared = screens.length * viewports.length;
          let n = 0;
          const browser = await chromium.launch();
          for (const s of screens) for (const v of viewports) {
            try {
              const page = await browser.newPage({ viewport: sizes[v] ?? sizes.desktop });
              await page.goto(base + s.path, { waitUntil: "networkidle", timeout: 30000 });
              await page.screenshot({ path: `artifacts/design/${s.name}-${v}.png`, fullPage: true });
              await page.close(); n++;
            } catch (e) { console.error(`capture failed: ${s.name}-${v}: ${e.message}`); }
          }
          await browser.close();
          console.log(`captured=${n}`);
          console.log(`declared=${declared}`);
          EOF
        env:
          SCREENS_B64: ${{ steps.cfg.outputs.screens_b64 }}
          VIEWPORTS_B64: ${{ steps.cfg.outputs.viewports_b64 }}
          READY_URL: ${{ steps.cfg.outputs.readyUrl }}

      - name: Validate exact declared screenshot set
        if: steps.cfg.outputs.enabled == 'true' && steps.scope.outputs.userFacing == 'true'
        env:
          SCREENS_B64: ${{ steps.cfg.outputs.screens_b64 }}
          VIEWPORTS_B64: ${{ steps.cfg.outputs.viewports_b64 }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          const decode = (value) => JSON.parse(Buffer.from(value, 'base64').toString('utf8'));
          const screens = decode(process.env.SCREENS_B64);
          const viewports = decode(process.env.VIEWPORTS_B64);
          const expected = screens.flatMap((screen) => viewports.map((viewport) => `${screen.name}-${viewport}.png`));
          const actual = new Set(fs.existsSync('artifacts/design') ? fs.readdirSync('artifacts/design') : []);
          const missing = expected.filter((name) => !actual.has(name));
          if (missing.length > 0) {
            console.error(`::error::Missing declared screenshots: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`Validated ${expected.length} declared screenshot identities.`);
          EOF

      - name: Upload screenshots (evidence)
        if: steps.cfg.outputs.enabled == 'true' && steps.scope.outputs.userFacing == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-design-screenshots-${{ github.event.pull_request.number }}
          path: artifacts/design/

      - name: Run function signal (repo e2e)
        id: fn
        if: steps.cfg.outputs.enabled == 'true' && steps.scope.outputs.userFacing == 'true' && steps.cfg.outputs.functionSignal != ''
        run: |
          set +e
          bash -lc "${{ steps.cfg.outputs.functionSignal }}"
          echo "exit=$?" >> "$GITHUB_OUTPUT"

  design_director:
    needs: design_evidence
    if: needs.design_evidence.outputs.enabled == 'true' && needs.design_evidence.outputs.user_facing == 'true' && needs.design_evidence.outputs.override_owner != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    outputs:
      verdict: ${{ steps.review.outputs.structured_output && fromJSON(steps.review.outputs.structured_output).verdict }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: atlas-design-screenshots-${{ github.event.pull_request.number }}
          path: artifacts/design/
      - name: Design-director review
        id: review
        uses: anthropics/claude-code-action@d07835ac7037978eb1aa67c6be18ed0883cea652 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model ${{ vars.ATLAS_REVIEWER_MODEL || 'claude-opus-4-8' }}
            --allowedTools 'Read,Grep,Glob'
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["GO","NO-GO"]},"findings":{"type":"array","items":{"type":"object","properties":{"screen":{"type":"string"},"viewport":{"type":"string"},"severity":{"type":"string"},"what":{"type":"string"},"why_it_matters":{"type":"string"}}}},"most_important":{"type":"string"},"unverified":{"type":"string"}},"required":["verdict","most_important"]}'
          prompt: |
            You are the Atlas design-director running in CI. You did NOT build this change.
            Follow plugin/atlas/skills/atlas-design-review/SKILL.md and the role definition
            plugin/atlas/agents/atlas-design-director.md exactly.

            The captured screenshots for PR #${{ github.event.pull_request.number }} are in
            ./artifacts/design/ (named <screen>-<viewport>.png). READ each PNG and review the
            actual pixels — legibility, hierarchy, layout integrity (especially mobile),
            state honesty, consistency, and obvious accessibility misses.

            The repo's own end-to-end run exited with code ${{ needs.design_evidence.outputs.function_exit || 'n/a' }}.
            The UI harness readiness was ${{ needs.design_evidence.outputs.ready_ok || 'unknown' }}.

            Hard rules: if a declared screen has no screenshot, do NOT approve it — that is a
            NO-GO. Do not narrate a screen you cannot see. Return the structured verdict.

  design-review:
    needs: [design_evidence, design_director]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Design gate
        id: gate
        run: |
          set -euo pipefail
          if [ "$EVIDENCE_RESULT" != "success" ]; then
            echo "::error::Design evidence job did not complete successfully."
            exit 1
          fi
          node --input-type=module <<'EOF'
          import { evaluateDesignGate } from "./plugin/atlas/design/gate.mjs";
          const num = (v, d) => { const n = Number(v); return Number.isFinite(n) ? n : d; };
          const bool = (v) => String(v) === "true";
          const fnRaw = process.env.FN_EXIT;
          const g = evaluateDesignGate({
            designEnabled: bool(process.env.ENABLED),
            prTouchesDesignPaths: bool(process.env.USER_FACING),
            harnessExitCode: num(process.env.HARNESS_EXIT, 0),
            readyOk: bool(process.env.READY_OK),
            screenshotsCaptured: num(process.env.CAPTURED, 0),
            declaredScreens: num(process.env.DECLARED, 0),
            functionSignalExit: (fnRaw === "" || fnRaw === undefined) ? null : num(fnRaw, 1),
            reviewerVerdict: process.env.VERDICT || null,
            override: { present: bool(process.env.OVR_PRESENT), actorIsOwner: bool(process.env.OVR_OWNER) },
          });
          console.log(`::notice::atlas-design-review ${g.status.toUpperCase()} — ${g.reason}`);
          if (g.blocks) { console.error(`::error::Design review BLOCKS this PR: ${g.reason}`); process.exit(1); }
          if (!g.pass) console.log(`::notice::Not a design pass (${g.status}); not recorded as green.`);
          EOF
        env:
          EVIDENCE_RESULT: ${{ needs.design_evidence.result }}
          ENABLED: ${{ needs.design_evidence.outputs.enabled }}
          USER_FACING: ${{ needs.design_evidence.outputs.user_facing }}
          # Whichever capture mode ran wrote these; the other step was skipped and its
          # outputs are empty. GitHub treats "0"/"false" as non-empty (truthy) strings, so
          # `||` preserves the real value from the step that actually ran.
          HARNESS_EXIT: ${{ needs.design_evidence.outputs.harness_exit }}
          READY_OK: ${{ needs.design_evidence.outputs.ready_ok }}
          CAPTURED: ${{ needs.design_evidence.outputs.captured }}
          DECLARED: ${{ needs.design_evidence.outputs.declared }}
          FN_EXIT: ${{ needs.design_evidence.outputs.function_exit }}
          VERDICT: ${{ needs.design_director.outputs.verdict }}
          OVR_PRESENT: ${{ needs.design_evidence.outputs.override_present }}
          OVR_OWNER: ${{ needs.design_evidence.outputs.override_owner }}
