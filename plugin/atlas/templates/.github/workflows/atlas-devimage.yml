name: atlas-devimage
# Build and publish the certified dev image when the toolchain changes.
# The digest it prints is what you pin in devcontainer.json and .atlas/project.json.
on:
  push:
    branches: ["{{DEFAULT_BRANCH}}"]
    paths:
      - "package-lock.json"
      - "package.json"
      - ".devcontainer/Dockerfile"
      - ".github/workflows/atlas-devimage.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lockfile hash
        id: lock
        run: echo "hash=$(sha256sum package-lock.json | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-dev:lock-${{ steps.lock.outputs.hash }}
            ghcr.io/${{ github.repository }}-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}-dev
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Pin this digest
        run: |
          {
            echo "### Certified dev image"
            echo ""
            echo '```'
            echo "ghcr.io/${{ github.repository }}-dev@${{ steps.push.outputs.digest }}"
            echo '```'
            echo ""
            echo "Pin it in **.devcontainer/devcontainer.json** (\`image\`) and **.atlas/project.json** (\`runtime.image\`)."
            echo "Verify provenance: \`gh attestation verify oci://ghcr.io/${{ github.repository }}-dev@${{ steps.push.outputs.digest }} -R ${{ github.repository }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
