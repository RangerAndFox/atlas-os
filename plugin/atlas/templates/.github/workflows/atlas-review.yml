# Atlas independent review — runs the atlas-reviewer role automatically on every PR.
#
# This is the required status check `independent-review`. It lets a non-technical
# owner merge on one informed tap: an adversarial reviewer that did NOT write the
# change reads the diff, RUNS the repo's own validation (it does not trust that
# tests pass — it runs them), tries to falsify the change, and returns a verdict.
#
# Verdict capture is DETERMINISTIC. The reviewer's result is forced into a JSON
# schema (--json-schema) and surfaced as the action's `structured_output`. The
# workflow gates deterministically on `verdict == GO`. It deliberately does not
# grant PR-write permission to the secret-bearing reviewer job.
#
# Risk-class routing is done by CODEOWNERS, not here: a guarded-path PR also needs
# the owner's review (one tap); an ordinary-code PR needs only this check green.
name: atlas-independent-review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Least privilege: the secret-bearing reviewer cannot write to the pull request.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: atlas-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review_context:
    runs-on: ubuntu-latest
    outputs:
      validation_exit: ${{ steps.validation.outputs.exit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Capture untrusted PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --binary "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Run validation in no-secret job
        id: validation
        run: |
          set +e
          {
            npm ci &&
            node --input-type=module <<'EOF'
          import { readFileSync } from 'node:fs';
          import { execSync } from 'node:child_process';
          const ladder = JSON.parse(readFileSync('.atlas/project.json', 'utf8')).validation?.ladder ?? [];
          if (ladder.length === 0) process.exit(1);
          for (const rung of ladder) execSync(rung.command, { stdio: 'inherit' });
          EOF
          } > "$RUNNER_TEMP/validation.log" 2>&1
          code=$?
          cat "$RUNNER_TEMP/validation.log"
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-review-context-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/pr.diff
            ${{ runner.temp }}/validation.log

  independent-review:
    needs: review_context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: atlas-review-context-${{ github.event.pull_request.number }}
          path: artifacts/review/

      # ---- Owner override --------------------------------------------------
      # "Block, but I can override." A NO-GO blocks. The owner — and ONLY the
      # owner, verified by the actor who applied the label — may override with a
      # deliberate, logged act: add the label `atlas-override-review`. The machine
      # account cannot self-clear a NO-GO, because it is not the owner. Override
      # bypasses THIS check only; code-owner review on guarded paths still stands.
      - name: Honor owner override
        id: override
        if: github.event.action == 'labeled' && github.event.label.name == 'atlas-override-review'
        run: |
          set -euo pipefail
          if [ "${{ github.event.sender.login }}" = "${{ vars.ATLAS_OWNER }}" ]; then
            echo "overridden=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Independent review OVERRIDDEN by owner ${{ vars.ATLAS_OWNER }} via atlas-override-review label."
          else
            echo "::error::atlas-override-review present but not applied by the owner. Override refused."
            exit 1
          fi

      - name: Independent adversarial review
        id: review
        if: steps.override.outputs.overridden != 'true'
        uses: anthropics/claude-code-action@d07835ac7037978eb1aa67c6be18ed0883cea652 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Reviewer model deliberately settable; prefer a different model than the
          # author used, so review is independent in model as well as context.
          # --json-schema forces the verdict into structured_output (see gate step).
          claude_args: |
            --model ${{ vars.ATLAS_REVIEWER_MODEL || 'claude-opus-4-8' }}
            --allowedTools 'Read,Grep,Glob'
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["GO","NO-GO"]},"summary":{"type":"string"},"most_important":{"type":"string"},"blast_radius":{"type":"string"},"unverified":{"type":"string"}},"required":["verdict","summary"]}'
          prompt: |
            You are the Atlas independent reviewer running in CI. You did NOT write
            this change. Follow plugin/atlas/skills/atlas-independent-review/SKILL.md
            exactly. Review PR #${{ github.event.pull_request.number }}:
            base ${{ github.event.pull_request.base.sha }} -> head ${{ github.event.pull_request.head.sha }}.

            You MUST:
            1. Read the full untrusted PR diff at artifacts/review/pr.diff.
            2. Read artifacts/review/validation.log, produced by a separate no-secret
               execution job. Do not execute PR-controlled code here.
            3. Confirm the tests exercise the real mechanism, not a harness that
               bypasses it. If they self-fool, that is a NO-GO reason on its own.
            4. Try to falsify the change with concrete inputs.
            5. Return your verdict as the structured output:
               - verdict: "GO" or "NO-GO"
               - summary: a <=200-word PLAIN-LANGUAGE verdict a non-coder can act on
               - most_important: the one thing that mattered most
               - blast_radius: what breaks if this is wrong, and whether it is reversible
               - unverified: one thing you could not verify
            Do NOT try to write a file or post a comment yourself — the workflow reads
            your structured output and gates on it directly.

      - name: Gate on the verdict
        if: steps.override.outputs.overridden != 'true'
        env:
          SO: ${{ steps.review.outputs.structured_output }}
          VALIDATION_EXIT: ${{ needs.review_context.outputs.validation_exit }}
        run: |
          set -euo pipefail
          if [ "$VALIDATION_EXIT" != "0" ]; then
            echo "::error::Independent validation failed in the no-secret job."
            exit 1
          fi
          if [ -z "${SO:-}" ]; then
            echo "::error::Reviewer produced no structured output. Failing closed — absence of a review is not a pass."
            exit 1
          fi
          verdict=$(printf '%s' "$SO" | jq -r '.verdict // empty')
          echo "Verdict: ${verdict:-<none>}"
          if [ "$verdict" != "GO" ]; then
            echo "::error::Independent review returned NO-GO (or no parseable verdict). Merge blocked. The owner may override by applying the atlas-override-review label after reading the reviewer's comment."
            exit 1
          fi
          echo "Independent review: GO."
