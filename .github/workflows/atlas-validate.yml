name: atlas-validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlas-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Guard policy and evasion suite
        run: bash plugin/atlas/hooks/atlas-guard.test.sh
      - name: Supervisor and design-gate acceptance
        run: node --test tests/acceptance/design-director/*.test.mjs tests/acceptance/supervisor/*.test.mjs
